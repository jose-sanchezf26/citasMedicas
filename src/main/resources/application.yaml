spring:
  application:
    name: citasMedicas
  # Conexión con la base de datos
  datasource:
    url: jdbc:postgresql://localhost:5433/citasMedicas
    username: admin
    password: admin
  # Configuración de JPA, para la persistencia de objetos entre la base de datos y Java
  jpa:
    # Spring crea las tablas automáticamente según las entidades JPA
    hibernate:
      ddl-auto: update
    # Muestra las consultas SQL en la consola
    show-sql: true

server:
  port: 8080

